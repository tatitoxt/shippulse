# Local demo stack. Every credential below is a throwaway value for the
# synthetic demo; override them via environment variables for anything else.
x-shippulse-env: &shippulse-env
  DATABASE_URL: postgres://shippulse:${POSTGRES_PASSWORD:-shippulse}@postgres:5432/shippulse?sslmode=disable
  NATS_URL: nats://nats:4222
  SIMRUNTIME_URL: http://simruntime:8090
  JWT_SECRET: ${JWT_SECRET:-demo-only-jwt-secret-not-for-production}
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-demo-only-webhook-secret}
  DEMO_PASSWORD: ${DEMO_PASSWORD:-shippulse-demo}

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: shippulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shippulse}
      POSTGRES_DB: shippulse
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shippulse -d shippulse"]
      interval: 2s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.11.9-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["4222:4222"]
    volumes: [nats_data:/data]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    image: shippulse:local
    build: .
    command: ["migrate"]
    environment: *shippulse-env
    depends_on:
      postgres: { condition: service_healthy }

  seed:
    image: shippulse:local
    command: ["seed"]
    environment: *shippulse-env
    depends_on:
      migrate: { condition: service_completed_successfully }

  simruntime:
    image: shippulse:local
    command: ["simruntime"]
    ports: ["8090:8090"]
    healthcheck:
      test: ["CMD", "/shippulse", "probe", "http://localhost:8090/healthz"]
      interval: 2s
      timeout: 3s
      retries: 20
    depends_on:
      migrate: { condition: service_completed_successfully }

  api:
    image: shippulse:local
    command: ["api"]
    environment: *shippulse-env
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "/shippulse", "probe", "http://localhost:8080/readyz"]
      interval: 2s
      timeout: 3s
      retries: 20
    depends_on:
      seed: { condition: service_completed_successfully }
      simruntime: { condition: service_healthy }

  worker:
    image: shippulse:local
    command: ["worker"]
    environment:
      <<: *shippulse-env
      WORKER_ID: worker-1
    depends_on:
      seed: { condition: service_completed_successfully }
      nats: { condition: service_healthy }
      simruntime: { condition: service_healthy }

  web:
    build: ./apps/web
    environment:
      CONTROL_PLANE_URL: http://api:8080
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres_data:
  nats_data:
